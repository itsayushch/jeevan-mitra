# =============================================================================
# PM-AJAY / JeevanMitra 2.0 - NSQ Course Recommendation System
# Configuration File
# =============================================================================
# NOTE: All data generated by this system is SYNTHETIC/DEMO data.
# It is NOT real government beneficiary data.
# =============================================================================

random_seed: 42

# --- Data Generation ---
data:
  n_beneficiaries: 10000
  n_courses: 200
  n_interactions: 25000
  negative_sample_ratio: 3

# --- File Paths (relative to project root) ---
paths:
  raw_beneficiary: data/raw/raw_beneficiary_data.csv
  cleaned_beneficiary: data/cleaned/cleaned_beneficiary_data.csv
  processed_beneficiary: data/processed/processed_beneficiary_data.csv
  courses: data/reference/courses.csv
  interactions: data/raw/historical_interactions.csv
  train: data/processed/train.csv
  validation: data/processed/validation.csv
  test: data/processed/test.csv
  model: models/best_model.pkl
  pipeline: models/preprocessing_pipeline.pkl
  model_comparison: models/model_comparison.json
  eda_dir: reports/eda

# --- Model Configuration ---
model:
  test_size: 0.2
  val_size: 0.2
  top_k: 5
  n_iter_search: 30
  cv_folds: 3

# --- Feature Configuration ---
features:
  # Numerical features for the (beneficiary, course) pair model
  numerical:
    - age
    - annual_family_income
    - work_experience_years
    - digital_literacy
    - communication_skill
    - numerical_skill
    - technical_skill
    - entrepreneurial_skill
    - distance_to_training_center_km
    - previous_training_count
    - training_completion_rate
    - course_duration_hours
    - average_salary
    - nsqf_level
    # Engineered
    - skill_match_score
    - distance_penalty
    - nsqf_appropriateness
    - experience_relevance
    - local_demand_score

  # Ordinal features with explicit category ordering
  ordinal:
    education_level:
      - No_Formal
      - Primary
      - Middle
      - Secondary
      - Senior_Secondary
      - Graduate
      - Post_Graduate
    existing_skill_level:
      - Beginner
      - Intermediate
      - Advanced
      - Expert
    preferred_duration:
      - Short
      - Medium
      - Long
    required_skill_level:
      - Beginner
      - Intermediate
      - Advanced
    local_job_demand:
      - Low
      - Medium
      - High
    local_demand:
      - Low
      - Medium
      - High
      - Very_High

  # Nominal features (one-hot encoded)
  nominal:
    - gender
    - social_category
    - employment_status
    - rural_urban
    - preferred_work_type
    - preferred_training_mode
    - delivery_mode

  # Binary engineered features (no encoding needed)
  binary_engineered:
    - career_interest_match
    - education_eligibility
    - industry_match
    - language_match
    - age_eligibility
    - training_mode_match

  # High-cardinality nominal features (frequency encoded)
  high_cardinality:
    - state
    - district
    - current_occupation
    - local_industry
    - sector
    - career_interest

  # Scaling strategy
  standard_scale:
    - age
    - digital_literacy
    - communication_skill
    - numerical_skill
    - technical_skill
    - entrepreneurial_skill
    - previous_training_count
    - nsqf_level
    - course_duration_hours
    - average_salary

  robust_scale:
    - annual_family_income
    - work_experience_years
    - distance_to_training_center_km

  no_scale:
    - skill_match_score
    - distance_penalty
    - nsqf_appropriateness
    - experience_relevance
    - local_demand_score
    - training_completion_rate

# --- Content-Based Fallback Weights ---
fallback:
  weights:
    career_interest_match: 0.20
    skill_compatibility: 0.20
    education_eligibility: 0.15
    local_demand: 0.12
    language_match: 0.10
    distance_penalty: 0.08
    training_mode_match: 0.08
    age_eligibility: 0.07

# --- Sectors ---
sectors:
  - IT / ITES
  - Healthcare
  - Retail
  - Agriculture
  - Construction
  - Automotive
  - Electronics
  - Tourism
  - Hospitality
  - Banking / Finance
  - Beauty & Wellness
  - Logistics
  - Manufacturing
  - Green Jobs
  - Telecom
  - Entrepreneurship

# --- Education Levels (ordered) ---
education_levels:
  - No_Formal
  - Primary
  - Middle
  - Secondary
  - Senior_Secondary
  - Graduate
  - Post_Graduate

# --- Indian States ---
states:
  - Andhra Pradesh
  - Arunachal Pradesh
  - Assam
  - Bihar
  - Chhattisgarh
  - Goa
  - Gujarat
  - Haryana
  - Himachal Pradesh
  - Jharkhand
  - Karnataka
  - Kerala
  - Madhya Pradesh
  - Maharashtra
  - Manipur
  - Meghalaya
  - Mizoram
  - Nagaland
  - Odisha
  - Punjab
