version: '3.8'

services:
  jeevanmitra-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jeevanmitra-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - HOST=0.0.0.0
      - DATABASE_PATH=/app/data/jeevanmitra.db
      - DEFAULT_DISTRICT=Moradabad
      - DEFAULT_STATE=Uttar Pradesh
      - AI_PROVIDER=mock
      - CONFIDENCE_THRESHOLD=0.75
      # - OPENAI_API_KEY=${OPENAI_API_KEY}
      # - BHASHINI_API_KEY=${BHASHINI_API_KEY}
      # - SARVAM_API_KEY=${SARVAM_API_KEY}
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
