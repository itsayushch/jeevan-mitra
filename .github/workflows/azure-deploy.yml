name: Build & Deploy JeevanMitra 2.0 Backend to Azure Container Apps

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/azure-deploy.yml'
  workflow_dispatch:

env:
  RESOURCE_GROUP: rg-jeevanmitra
  CONTAINER_APP_NAME: jeevanmitra-backend
  ACR_NAME: acrjeevanmitra

jobs:
  test:
    name: Run Backend Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package.json

      - name: Install Dependencies
        working-directory: backend
        run: npm ci || npm install

      - name: Compile TypeScript
        working-directory: backend
        run: npm run build

      - name: Run Vitest Suite (17 Tests)
        working-directory: backend
        run: npm test

  deploy:
    name: Build & Deploy to Azure
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and Push Docker Image via ACR Cloud Build
        run: |
          az acr build \
            --registry ${{ env.ACR_NAME }} \
            --image ${{ env.CONTAINER_APP_NAME }}:${{ github.sha }} \
            --image ${{ env.CONTAINER_APP_NAME }}:latest \
            ./backend

      - name: Deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v2
        with:
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          containerAppName: ${{ env.CONTAINER_APP_NAME }}
          imageToDeploy: ${{ env.ACR_NAME }}.azurecr.io/${{ env.CONTAINER_APP_NAME }}:${{ github.sha }}
