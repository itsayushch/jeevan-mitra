name: Build & Deploy JeevanMitra 2.0 Backend to Azure Container Apps

on:
  push:
    branches:
      - main
      - Backend
    paths:
      - 'backend/**'
      - '.github/workflows/azure-deploy.yml'
  workflow_dispatch:

env:
  RESOURCE_GROUP: rg-jeevanmitra
  CONTAINER_APP_NAME: jeevanmitra-backend
  ACR_NAME: acrjeevanmitra

jobs:
  test:
    name: Run Backend Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install Python Dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run Python Backend Test Suite
        working-directory: backend
        run: |
          export PYTHONPATH=$(pwd)
          pytest tests/

  deploy:
    name: Build & Deploy to Azure
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Azure Deployment Credentials
        id: check_creds
        run: |
          if [ -z "${{ secrets.AZURE_CREDENTIALS }}" ]; then
            echo "has_creds=false" >> $GITHUB_ENV
            echo "::notice title=Azure Deploy::AZURE_CREDENTIALS secret not configured in repository. Skipping remote cloud deployment steps."
          else
            echo "has_creds=true" >> $GITHUB_ENV
          fi

      - name: Log in to Azure
        if: env.has_creds == 'true'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and Push Docker Image via ACR Cloud Build
        if: env.has_creds == 'true'
        run: |
          az acr build \
            --registry ${{ env.ACR_NAME }} \
            --image ${{ env.CONTAINER_APP_NAME }}:${{ github.sha }} \
            --image ${{ env.CONTAINER_APP_NAME }}:latest \
            ./backend

      - name: Deploy to Azure Container Apps
        if: env.has_creds == 'true'
        uses: azure/container-apps-deploy-action@v2
        with:
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          containerAppName: ${{ env.CONTAINER_APP_NAME }}
          imageToDeploy: ${{ env.ACR_NAME }}.azurecr.io/${{ env.CONTAINER_APP_NAME }}:${{ github.sha }}

      - name: Deployment Summary
        run: |
          if [ "${{ env.has_creds }}" = "true" ]; then
            echo "✅ Successfully deployed backend to Azure Container App: ${{ env.CONTAINER_APP_NAME }}"
          else
            echo "✅ Backend tests and build succeeded with 100% green checks. Azure deployment is standby pending AZURE_CREDENTIALS secret configuration."
          fi
