name: Backend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest fastapi uvicorn
        # Assuming requirements.txt exists in real project
        if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
    - name: Run Python compileall
      run: python -m compileall backend/app
    - name: Run unit tests
      run: cd backend && pytest
    - name: Run integration tests
      run: cd backend && pytest -m integration
    - name: Run security tests
      run: cd backend && pytest -m security
    
  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@v3
    - name: Build Docker image
      run: cd backend && docker build -t jeevan-mitra-backend .
