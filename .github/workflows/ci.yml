name: JeevanMitra 2.0 CI/CD Quality Gate

on:
  push:
    branches: [ main, "feat/**", "release/**" ]
  pull_request:
    branches: [ main ]

jobs:
  # ---------------------------------------------------------------------------
  # 1. Backend Quality Gate
  # ---------------------------------------------------------------------------
  backend-quality-gate:
    name: Backend Lint, Security, Migrations & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install flake8 pytest pytest-asyncio

      # Quality Check 1: Code Formatting & Lint
      - name: Backend Syntax and Lint Check
        run: |
          flake8 app tests scripts --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 app --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics

      # Quality Check 2: Secret Scan
      - name: Secret Scan (Detect Hardcoded Credentials)
        run: |
          python -c "
          import re, sys
          from pathlib import Path
          patterns = [
              re.compile(r'AKIA[0-9A-Z]{16}'),
              re.compile(r'(?i)ghp_[0-9a-zA-Z]{36}'),
              re.compile(r'(?i)AIza[0-9A-Za-z\\-_]{35}'),
              re.compile(r'-----BEGIN (?:RSA )?PRIVATE KEY-----')
          ]
          found = 0
          for py_file in Path('app').rglob('*.py'):
              content = py_file.read_text(encoding='utf-8', errors='ignore')
              for pat in patterns:
                  if pat.search(content):
                      print(f'CRITICAL: Secret pattern matched in {py_file}')
                      found += 1
          if found > 0:
              sys.exit(1)
          print('Secret scan completed: Zero exposed credentials detected.')
          "

      # Quality Check 3: Alembic Upgrade from Empty Database to Head
      - name: Clean Database Migration Gate (Empty DB -> Head)
        run: |
          export DATABASE_URL="sqlite:///./ci_empty_test.db"
          export DATABASE_PATH="./ci_empty_test.db"
          alembic upgrade head
          python -c "
          import sqlite3
          conn = sqlite3.connect('ci_empty_test.db')
          rev = conn.execute('SELECT version_num FROM alembic_version;').fetchone()[0]
          print(f'Successfully migrated to head revision: {rev}')
          assert rev == 'f3a4b5c6d7e8', f'Unexpected revision: {rev}'
          "

      # Quality Check 4: Full Automated Test Suite
      - name: Run Backend Regression & Security Test Suite
        run: |
          pytest -q

      # Quality Check 5: Automated Backup & Restore Drill
      - name: Execute Backup & Restore Disaster Recovery Drill
        run: |
          python scripts/db_backup_restore_drill.py

      # Quality Check 6: Operational Alerts & Data Quality Check
      - name: Check Operational Alerts & Data Quality
        run: |
          python scripts/check_operational_alerts.py
          python scripts/check_planning_data_quality.py --district Moradabad

  # ---------------------------------------------------------------------------
  # 2. Frontend Quality Gate
  # ---------------------------------------------------------------------------
  frontend-quality-gate:
    name: Frontend Lint, Typecheck & Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        run: npm ci || npm install

      - name: Run TypeScript & Next.js Production Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: "http://localhost:4000/api/v1"
          NEXT_PUBLIC_DEMO_AUTH_FALLBACK: "false"

  # ---------------------------------------------------------------------------
  # 3. Integrated Smoke Test & Release Gate
  # ---------------------------------------------------------------------------
  smoke-and-readiness-gate:
    name: API Live, Ready & Observability Smoke Test
    runs-on: ubuntu-latest
    needs: [ backend-quality-gate, frontend-quality-gate ]
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Migrations on Staging Test DB
        run: |
          alembic upgrade head

      - name: Launch Server in Background
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 4000 &
          sleep 4

      - name: Execute Live & Ready Health Probes
        run: |
          curl -f http://127.0.0.1:4000/health/live
          curl -f http://127.0.0.1:4000/health/ready
          curl -f http://127.0.0.1:4000/health/version
          curl -f http://127.0.0.1:4000/api/v1/monitoring/alerts
